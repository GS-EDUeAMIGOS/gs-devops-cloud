name: viacidada
services:
  db:
    image: gvenzl/oracle-xe:21-slim-faststart
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?Gere o arquivo .env}
      APP_USER: viacidada
      APP_USER_PASSWORD: ${ORACLE_APP_PASSWORD:?Gere o arquivo .env}
    ports:
      - "127.0.0.1:${DB_PORT:-1521}:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./database/01-init.sh:/container-entrypoint-initdb.d/01-init.sh:ro
      - ./database/schema:/opt/viacidada-schema:ro
    networks: [backend]
    shm_size: 1g
    mem_limit: 3g
    healthcheck:
      test: [CMD-SHELL, "healthcheck.sh && test -f /opt/oracle/oradata/.viacidada-schema-ready"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 90s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  api:
    image: ${API_IMAGE:-viacidada-api:local}
    build: {context: ., dockerfile: Dockerfile}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: oracle
      ORACLE_DB_URL: jdbc:oracle:thin:@//db:1521/XEPDB1
      ORACLE_DB_USERNAME: viacidada
      ORACLE_DB_PASSWORD: ${ORACLE_APP_PASSWORD:?Gere o arquivo .env}
      ORACLE_DDL_AUTO: validate
      ORACLE_SHOW_SQL: "false"
      JWT_SECRET: ${JWT_SECRET:?Gere o arquivo .env}
      JWT_EXPIRATION_MS: "86400000"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      SPTRANS_TOKEN: ${SPTRANS_TOKEN:-}
      SERVER_PORT: "8080"
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: never
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8080}:8080"
    depends_on:
      db: {condition: service_healthy}
    networks: [backend, ingress]
    mem_limit: 1536m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  proxy:
    image: caddy:2-alpine
    profiles: [public]
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [ingress]
    depends_on:
      api: {condition: service_healthy}
    mem_limit: 256m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  oracle-data:
    name: viacidada-oracle-data
  caddy-data:
    name: viacidada-caddy-data
  caddy-config:
    name: viacidada-caddy-config
networks:
  backend:
    name: viacidada-backend
  ingress:
    name: viacidada-ingress
